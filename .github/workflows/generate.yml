name: Generate

# Renders apps on the native Tanka layout (apps/<app>/environments/<cluster>)
# and publishes the result to the private VoyTechnology/homelab-manifests repo as
# <cluster>/<app>/*.yaml. Flux reconciles that repo; nothing is hand-edited there.
# Needs the MANIFESTS_DEPLOY_KEY secret: a deploy key with write access to it.
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "argo/appsets/**"
      - "argo/lib/**"
      - "argo/clusters/**"
      - "scripts/render-apps.js"
      - ".tool-versions"
      - ".github/workflows/generate.yml"
  workflow_dispatch:

concurrency:
  group: generate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: src

      - name: Install tools
        uses: jdx/mise-action@v2
        with:
          working_directory: src
          install_args: go-jsonnet jsonnet-bundler tanka yq

      - name: Put tools on PATH
        working-directory: src
        run: mise bin-paths >> "$GITHUB_PATH"

      - name: Generate
        working-directory: src
        run: node scripts/render-apps.js generate . ../out

      - name: Add homelab-manifests deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MANIFESTS_DEPLOY_KEY }}

      - name: Publish to homelab-manifests
        run: |
          git clone -q git@github.com:VoyTechnology/homelab-manifests.git manifests
          cd manifests
          git checkout -q -B main
          # Replace everything but .git so removed apps are pruned.
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R ../out/. .
          git add -A
          if git diff --cached --quiet; then
            echo "homelab-manifests is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Generated from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin main
