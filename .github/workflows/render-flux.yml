name: Render Flux

# Renders Flux itself (clusters/environments/<cluster>) and every app
# (apps/*/environments/<cluster>). On PRs
# it comments the diff against homelab-manifests; on main it commits the result
# straight to main there, which Flux then reconciles.
on:
  push:
    branches: [main]
    paths:
      - "clusters/**"
      - "apps/**"
      - "scripts/render-flux.sh"
      - ".tool-versions"
      - ".github/workflows/render-flux.yml"
  pull_request:
    paths:
      - "clusters/**"
      - "apps/**"
      - "scripts/render-flux.sh"
      - ".tool-versions"
      - ".github/workflows/render-flux.yml"
  workflow_dispatch:

concurrency:
  group: render-flux-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a run that may be pushing to homelab-manifests.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  clusters:
    runs-on: ubuntu-latest
    outputs:
      clusters: ${{ steps.list.outputs.clusters }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        # One cluster per clusters/environments/<name> directory.
        run: echo "clusters=$(ls clusters/environments | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  render:
    needs: clusters
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cluster: ${{ fromJSON(needs.clusters.outputs.clusters) }}
    env:
      # The render owns exactly these paths in homelab-manifests.
      OUT_PATHS: >-
        clusters/${{ matrix.cluster }}/flux-system
        clusters/${{ matrix.cluster }}/apps
        apps/${{ matrix.cluster }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: homelab

      - name: Checkout homelab-manifests
        uses: actions/checkout@v6
        with:
          repository: VoyTechnology/homelab-manifests
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}
          path: base

      - name: Install tools
        uses: jdx/mise-action@v2
        with:
          working_directory: homelab
          install_args: go-jsonnet jsonnet-bundler tanka yq flux2 helm

      - name: Put tools on PATH
        working-directory: homelab
        run: mise bin-paths >> "$GITHUB_PATH"

      - name: Render
        run: homelab/scripts/render-flux.sh ${{ matrix.cluster }} head

      - name: Diff against homelab-manifests
        # Collapsed per-file diffs grouped by app: a size-capped one for the PR
        # comment and the full one for the job summary.
        run: |
          homelab/scripts/diff-flux.sh base head ${{ matrix.cluster }} > comment.md
          homelab/scripts/diff-flux.sh base head ${{ matrix.cluster }} 900000 >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        # Fork PRs get a read-only token and no secrets.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: render-flux-${{ matrix.cluster }}
          path: comment.md

      - name: Commit to homelab-manifests
        if: github.event_name != 'pull_request'
        working-directory: base
        run: |
          for p in $OUT_PATHS; do
            mkdir -p "$p" "../head/$p"
            rsync -a --delete "../head/$p/" "$p/"
            git add -A "$p"
          done
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "flux(${{ matrix.cluster }}): render from homelab@${{ github.sha }}"
          git pull --rebase origin main
          git push origin HEAD:main
