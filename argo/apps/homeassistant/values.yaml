homeassistant:
  hostNetwork: true
  # Extra permissions needed for Zigbee Dongle
  securityContext:
    privileged: true

  service:
    port: 8123

  ingress:
    enabled: true
    hosts:
      - host: homeassistant.REPLACE_ME
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    tls:
      - secretName: homeassistant-tls
        hosts:
          - homeassistant.REPLACE_ME
  configuration:
    enabled: true
    trusted_proxies:
      - 10.0.0.0/8 # Too much?
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi

  # Exposes the built-in Prometheus integration (chart auto-enables
  # `prometheus:` in configuration.yaml once this is on) at /api/prometheus
  # and creates a ServiceMonitor for it. Alloy already watches
  # ServiceMonitor targets cluster-wide (prometheus.operator.servicemonitors
  # in alloy-config.alloy), so no scrape config changes are needed there.
  # HA's API requires auth on every request, so the endpoint is secured with
  # a bearer token pulled from the same long-lived access token used by
  # Matter Hub below (homeassistant-matterhub secret, key: token) -- HA
  # tokens aren't scope-limited, so reusing it avoids provisioning a second
  # one just for scraping.
  serviceMonitor:
    enabled: true
    scrapeInterval: 30s
    bearerToken:
      secretName: homeassistant-matterhub
      secretKey: token

matter:
  # Can this be hardcoded? Will we need to do some funky lookups?
  networkInterface: enp6s0
  persistence:
    size: 10Gi
    storageClassName: longhorn

# Home Assistant Matter Hub - exposes HA entities as Matter devices
# Prerequisites:
# The Home Assistant URL and access token are automatically pulled from the
# shared-secrets in kube-system namespace via External Secrets Operator.
# Keys used: homeassistant_url and homeassistant_token
# The resulting homeassistant-matterhub secret's `token` key is also reused
# above by homeassistant.serviceMonitor.bearerToken for Prometheus scraping.
matterhub:
  enabled: true
  image:
    name: ghcr.io/riddix/home-assistant-matter-hub:2.0.48
  
  # Home Assistant connection configuration
  homeAssistant:
    # URL and token are pulled from shared-secrets via External Secrets
    secret:
      name: homeassistant-matterhub
  
  # Application configuration
  logLevel: info
  httpPort: 8482
  
  # Optional: Network interface for mDNS (adjust based on your setup)
  # mdnsNetworkInterface: enp6s0
  
  # Optional: IP whitelist (CIDR notation)
  # httpIpWhitelist:
  #   - "10.0.0.0/8"
  #   - "192.168.0.0/16"
  
  # Resource limits
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
  
  # Persistent storage for Matter Hub data
  persistence:
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClassName: longhorn
  
  # Service configuration
  service:
    type: ClusterIP
    port: 8482
  
  # Ingress configuration for web UI access
  ingress:
    enabled: false
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - matter.REPLACE_ME
