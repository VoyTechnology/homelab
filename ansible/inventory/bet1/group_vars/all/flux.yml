---
###
# FLUX
###

flux_k8s_namespace: flux-system
# renovate: datasource=helm depName=flux2 registryUrl=https://fluxcd-community.github.io/helm-charts
flux_chart_version: "2.20.0"

# Tanka environment rendering the GitRepository + Kustomization that sync
# VoyTechnology/homelab-manifests (see apps/flux).
flux_sync_env: "{{ playbook_dir }}/../../apps/flux/environments/{{ cluster_name }}"

# Secret `homelab-manifests` (see apps/flux/lib/config.libsonnet) holds the read-only deploy key.
# `flux_manifests_deploy_key` lives in the git-crypt encrypted flux.secret.yml.
flux_manifests_secret: homelab-manifests
# https://api.github.com/meta -> ssh_keys
flux_known_hosts: |
