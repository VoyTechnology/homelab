---
- name: ArgoCD | Add Helm Repo
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: ArgoCD | Tanka Generate Script
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-tanka-scripts
        namespace: "{{ argocd_k8s_namespace }}"
      data:
        tanka-generate.sh: |
          #!/bin/sh
          set -e
          printf '{
            "apiVersion": "tanka.dev/v1alpha1",
            "kind": "Environment",
            "metadata": { "name": "%s/%s/%s" },
            "spec": {
              "apiServer": "%s",
              "namespace": "%s"
            }
          }\n' "${ARGOCD_ENV_TANKA_CLUSTER:-$TANKA_CLUSTER}" "${ARGOCD_ENV_TANKA_NAMESPACE:-$TANKA_NAMESPACE}" "${ARGOCD_ENV_TANKA_APP:-$TANKA_APP}" "${ARGOCD_ENV_TANKA_APISERVER:-$TANKA_APISERVER}" "${ARGOCD_ENV_TANKA_NAMESPACE:-$TANKA_NAMESPACE}" > spec.json
          mv main.jsonnet _main.jsonnet
          cat <<TMPEOF > main.jsonnet
          (import "_main.jsonnet") + ${ARGOCD_ENV_TANKA_OVERRIDES:-$TANKA_OVERRIDES}
          TMPEOF
          tk show . --dangerous-allow-redirect

- name: ArgoCD | Tanka Git Deploy Key
  no_log: true # Do not show logs as they contain the private ssh key
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-tanka-git
        namespace: "{{ argocd_k8s_namespace }}"
      type: Opaque
      stringData:
        ssh-privatekey: "{{ argocd_tanka_git_ssh_key }}"

- name: ArgoCD | Deploy Helm Chart
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_k8s_namespace }}"
    update_repo_cache: true
    values:
      global:
        domain: "argocd.{{ cluster_domain }}"
      server:
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt
          tls: true
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            # The argocd-mixin dashboards select on this literal job name,
            # not on anything derivable from pod labels.
            relabelings:
              - targetLabel: job
                replacement: integrations/argocd/argocd-server
      controller:
        extraArgs:
          - --repo-server-timeout-seconds
          - "500" # account for slow Argo with multiple deps.
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            relabelings:
              - targetLabel: job
                replacement: integrations/argocd/application-controller
      applicationSet:
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
      repoServer:
        replicas: 2
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            relabelings:
              - targetLabel: job
                replacement: integrations/argocd/repo-server
        env:
          - name: "ARGOCD_EXEC_TIMEOUT"
            value: "5m"
          - name: "ARGOCD_HELM_ALLOW_CONCURRENCY"
            value: "true"
        volumes:
          - name: tanka-plugin
            configMap:
              name: argocd-cmp-cm
          - name: tanka-scripts
            configMap:
              name: argocd-tanka-scripts
              defaultMode: 493
          - name: tmp-dir
            emptyDir: {}
          - name: tanka-git
            secret:
              secretName: argocd-tanka-git
        extraContainers:
          - name: tanka
            command: [/var/run/argocd/argocd-cmp-server]
            image: grafana/tanka:0.39.5
            imagePullPolicy: IfNotPresent
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 500m
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
            env:
              # Lets `jb install` clone the private ha-data repo (see the plugin init).
              - name: GIT_CONFIG_GLOBAL
                value: /tmp/tanka-gitconfig
              - name: GIT_SSH_COMMAND
                value: ssh -i /tmp/tanka-git-key -o UserKnownHostsFile=/tmp/tanka-known-hosts -o StrictHostKeyChecking=accept-new
            volumeMounts:
              - mountPath: /var/run/argocd
                name: var-files
              - mountPath: /etc/tanka-git
                name: tanka-git
                readOnly: true
              - mountPath: /home/argocd/cmp-server/plugins
                name: plugins
              - mountPath: /home/argocd/cmp-server/config/plugin.yaml
                subPath: tanka-plugin.yaml
                name: tanka-plugin
              - mountPath: /tmp
                name: tmp-dir
              - mountPath: /home/argocd/cmp-server/scripts
                name: tanka-scripts
      configs:
        cm:
          url: "https://argocd.{{ cluster_domain }}"
          oidc.config: |
            name: dex
            issuer: "https://login.{{ cluster_domain }}"
            clientID: $oidc.dex.clientID
            clientSecret:  $oidc.dex.clientSecret
          admin:
            enabled: false
        cmp:
          create: true
          plugins:
            tanka-plugin:
              version: v1.0
              init:
                # ssh rejects the secret mount's permissions, so use a 0600 copy of the key.
                command:
                  - sh
                  - -c
                  - |
                    set -e
                    install -m 600 /etc/tanka-git/ssh-privatekey /tmp/tanka-git-key
                    git config --global url."git@github.com:VoyTechnology/ha-data".insteadOf "https://github.com/VoyTechnology/ha-data"
                    jb install
              generate:
                command: [sh, /home/argocd/cmp-server/scripts/tanka-generate.sh]
              discover:
                fileName: jsonnetfile.json
              allowConcurrency: true
              lockRepo: true
        params:
          server.insecure: "true"
        secret:
          extra:
            oidc.dex.clientID: "{{ dex_argo_client_id }}"
            oidc.dex.clientSecret: "{{ dex_argo_client_secret }}"
        rbac:
          policy.csv: |
            p, role:admin, applications, create, */*, allow
            p, role:admin, applications, update, */*, allow
            p, role:admin, applications, delete, */*, allow
            p, role:admin, applications, sync, */*, allow
            p, role:admin, applications, override, */*, allow
            p, role:admin, applications, action/*, */*, allow
            p, role:admin, applicationsets, get, */*, allow
            p, role:admin, applicationsets, create, */*, allow
            p, role:admin, applicationsets, update, */*, allow
            p, role:admin, applicationsets, delete, */*, allow
            p, role:admin, certificates, create, *, allow
            p, role:admin, certificates, update, *, allow
            p, role:admin, certificates, delete, *, allow
            p, role:admin, clusters, create, *, allow
            p, role:admin, clusters, update, *, allow
            p, role:admin, clusters, delete, *, allow
            p, role:admin, repositories, create, *, allow
            p, role:admin, repositories, update, *, allow
            p, role:admin, repositories, delete, *, allow
            p, role:admin, projects, create, *, allow
            p, role:admin, projects, update, *, allow
            p, role:admin, projects, delete, *, allow
            p, role:admin, accounts, update, *, allow
            p, role:admin, gpgkeys, create, *, allow
            p, role:admin, gpgkeys, delete, *, allow
            p, role:admin, exec, create, */*, allow

            g, {{ argocd_admin_email }}, role:admin
          scopes: "[email,groups]"
      dex:
        enabled: false # We use our own dex instance

- name: ArgoCD | Setup Projects
  with_items: "{{ argocd_projects }}"
  kubernetes.core.k8s:
    state: present
    template:
      - path: "argo-project.yaml.j2"

- name: ArgoCD | Setup Application Namespaces
  no_log: true # Do not show logs as they contain private ssh keys
  with_items: "{{ argocd_applications }}"
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ item.namespace }}"

- name: ArgoCD | Setup Applications
  no_log: true # Do not show logs as they contain private ssh keys
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: ApplicationSet
      metadata:
        name: applications
        namespace: "{{ argocd_k8s_namespace }}"
      spec:
        generators:
          - list:
              elements: |
                {{ argocd_applications }}
        template:
          metadata:
            name: !unsafe "{{ name }}"
          spec:
            project: !unsafe "{{ project }}"
            source:
              repoURL: !unsafe "{{ repo }}"
              targetRevision: HEAD
              path: !unsafe "{{ path }}"
            destination:
              server: https://kubernetes.default.svc
              namespace: !unsafe "{{ namespace }}"
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
            revisionHistoryLimit: 3

- name: ArgoCD | Add Deploy Keys
  no_log: true # Do not show logs as they contain private ssh keys
  with_items: "{{ argocd_applications }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item.name }}-repo"
        #
        # TODO: Revisit this as its weird to pull the namespace like that for tailscale.
        namespace: "{{ argocd_k8s_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: "{{ item.repo }}"
        sshPrivateKey: "{{ item.sshPrivateKey }}"
